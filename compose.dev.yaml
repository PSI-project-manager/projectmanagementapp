services:
  backend:
    build:
      context: ./backend/
      dockerfile: Dockerfile
    environment:
      Db__ConnString: "Host=db;Port=5432;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=${POSTGRES_DB}"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/App:z
      - /App/src/Domain/obj
      - /App/src/Domain/bin
      - /App/src/Application/obj
      - /App/src/Application/bin
      - /App/src/Infrastructure/obj
      - /App/src/Infrastructure/bin
      - /App/src/Presentation/obj
      - /App/src/Presentation/bin
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/App:z
      - /App/node_modules
