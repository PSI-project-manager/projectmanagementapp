name: Lint check

on:
  pull_request:
    paths:
      - "frontend/**"
  push:
    branches: [main]
    paths:
      - "frontend/**"

jobs:
  eslint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reports lint errors as a warning but never fails the job, so it can't block merging.
      - name: Check lint
        continue-on-error: true
        run: |
          if ! pnpm lint; then
            echo "::warning title=ESLint::Some frontend files have lint errors. Run 'pnpm lint' from frontend/."
            exit 1
          fi
